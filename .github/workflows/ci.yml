name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by actions/upload-code-coverage.
      code-quality: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # vitest is configured with hard coverage thresholds (90% lines /
      # statements / functions, 85% branches), so this step fails the build on
      # its own if coverage regresses — independently of the upload below.
      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Upload coverage to GitHub
        # Forks cannot write code-quality results; skip rather than fail.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/vitest
          # The ingestion endpoint 404s until GitHub Code Quality is enabled for
          # the repository (Settings -> Advanced Security -> Code quality).
          # Until then this reports a warning instead of failing a build whose
          # coverage gate has already passed in the step above; once it is
          # enabled, results start flowing with no change needed here.
          fail-on-error: false
